<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Table fixture</title>
  <style>
    body { font-family: Arial; }
    table { border-collapse: separate; border-spacing: 0; }
    th, td { border: 2px solid #777; padding: 6px; }
    caption { text-align: left; font-weight: bold; }
    table.data-table tr:first-child td { font-weight: bold; background: #eee; }
  </style>
</head>
<body>
  <h3>Quarterly Sales</h3>

  <table class="data-table">
    <tr>
      <td>Product</td>
      <td>SKU</td>
      <td>Price</td>
      <td>Stock</td>
    </tr>
    <tr>
      <td>RHEL 9</td>
      <td>SKU-001</td>
      <td>$499</td>
      <td>120</td>
    </tr>
    <tr>
      <td>OpenShift</td>
      <td>SKU-002</td>
      <td>$2400</td>
      <td>45</td>
    </tr>
    <tr>
      <td>Ansible</td>
      <td>SKU-003</td>
      <td>$350</td>
      <td>200</td>
    </tr>
  </table>
</body>
</html>
